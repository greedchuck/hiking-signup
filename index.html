<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日月潭健行報名</title>
  <!-- Tailwind CSS 美化樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF 官方 SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/2.22.3/sdk.js"></script>
  <!-- 彈跳提示視窗套件 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-emerald-50 min-h-screen p-4 flex justify-center items-center">
  <div class="bg-white rounded-2xl shadow-md w-full max-w-md p-6">
    <div class="text-center mb-6">
      <span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full">好玩健行社團</span>
      <h1 class="text-2xl font-bold text-gray-800 mt-2">日月潭健行活動報名</h1>
      <p id="status-text" class="text-xs text-gray-400 mt-1">正在連線 LINE 系統...</p>
    </div>

    <form id="signupForm" class="space-y-4">
      <!-- 隱藏的 LINE UID -->
      <input type="hidden" id="userId" />

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">姓名 *</label>
        <input type="text" id="memberName" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">所屬分組 *</label>
        <select id="groupName" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="第一組">第一組</option>
          <option value="第二組">第二組</option>
          <option value="第三組">第三組</option>
          <option value="幹部顧問組">幹部顧問組</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">參加人數 *</label>
        <select id="attendeeCount" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="1">1 人</option>
          <option value="2">2 人</option>
          <option value="3">3 人</option>
          <option value="4">4 人</option>
          <option value="5">5 人</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">中午是否用中餐</label>
        <div class="flex space-x-6 mt-1">
          <label class="flex items-center"><input type="radio" name="lunch" value="yes" checked class="text-emerald-600"> <span class="ml-2 text-sm text-gray-700">是</span></label>
          <label class="flex items-center"><input type="radio" name="lunch" value="no" class="text-emerald-600"> <span class="ml-2 text-sm text-gray-700">否</span></label>
        </div>
      </div>

      <!-- 中餐連動區塊 -->
      <div id="mealBox" class="bg-gray-50 border rounded-lg p-3 space-y-2">
        <p class="text-xs text-gray-500 font-medium">請分配菜色（總份數須等於參加人數）：</p>
        <div class="grid grid-cols-3 gap-2">
          <div><label class="text-xs text-gray-600">牛肉</label><input type="number" id="mealBeef" min="0" value="1" class="w-full border rounded p-1.5 text-center text-sm" /></div>
          <div><label class="text-xs text-gray-600">雞肉</label><input type="number" id="mealChicken" min="0" value="0" class="w-full border rounded p-1.5 text-center text-sm" /></div>
          <div><label class="text-xs text-gray-600">素食</label><input type="number" id="mealVege" min="0" value="0" class="w-full border rounded p-1.5 text-center text-sm" /></div>
        </div>
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg transition duration-200 shadow">
        確認送出
      </button>
    </form>
  </div>

  <script>
    // ⚠️ 稍後取得 LIFF ID 後，請替換此處的文字
    const MY_LIFF_ID = "2011615747-o7IN23lO";

    // 控制中餐區塊顯示或隱藏
    document.querySelectorAll('input[name="lunch"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.getElementById('mealBox').classList.toggle('hidden', e.target.value === 'no');
      });
    });

    // 初始化 LIFF
    async function initializeLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        // 取得使用者 LINE 資訊
        const profile = await liff.getProfile();
        document.getElementById('userId').value = profile.userId;
        document.getElementById('memberName').value = profile.displayName;
        document.getElementById('status-text').innerText = `已連線身分：${profile.displayName}`;
      } catch (err) {
        document.getElementById('status-text').innerText = "連線失敗，請檢查 LIFF ID 設定";
        console.error(err);
      }
    }
    initializeLiff();

    // 送出表單驗證
    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const count = parseInt(document.getElementById('attendeeCount').value);
      const needLunch = document.querySelector('input[name="lunch"]:checked').value === 'yes';
      const beef = parseInt(document.getElementById('mealBeef').value || 0);
      const chicken = parseInt(document.getElementById('mealChicken').value || 0);
      const vege = parseInt(document.getElementById('mealVege').value || 0);

      if (needLunch && (beef + chicken + vege !== count)) {
        Swal.fire('數量不吻合', `中餐總份數 (${beef + chicken + vege}) 必須等於參加人數 (${count})！`, 'warning');
        return;
      }

      Swal.fire({
        title: '報名資料確認',
        html: `<p>姓名：${document.getElementById('memberName').value}</p><p>人數：${count} 人</p>`,
        icon: 'success',
        confirmButtonText: '完成並關閉'
      }).then(() => {
        if (liff.isInClient()) {
          liff.closeWindow(); // 在 LINE 內部時自動關閉視窗
        }
      });
    });
  </script>
</body>
</html>
